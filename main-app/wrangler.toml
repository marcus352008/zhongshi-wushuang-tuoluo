# 《中史無雙陀螺》main battle app — VERSION 0.5.13-card-load
# Registry：初中｜Publish 隱藏｜draw-app 另見 wushuang-tuoluo-draw
name = "wushuang"
main = "worker/index.ts"
compatibility_date = "2026-10-26"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "BattleRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoom"]

[vars]
VERSION = "0.5.13-card-load"
