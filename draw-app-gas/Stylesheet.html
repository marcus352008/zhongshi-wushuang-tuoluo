<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --text: #f0f4f8;
  --muted: #8b9bb4;
  --accent: #e8a838;
  --accent2: #3d8bfd;
  --ok: #3dd68c;
  --danger: #f07178;
  --border: #2a3548;
  --rarity-common: #9aa8bc;
  --rarity-good: #3d8bfd;
  --rarity-epic: #b388ff;
  --rarity-legend: #e8a838;
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #1a2740 0%, var(--bg) 55%);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
.app { max-width: 720px; margin: 0 auto; padding: 16px 14px 48px; }
header { text-align: center; margin-bottom: 16px; }
h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.06em; }
.sub { color: var(--muted); margin: 4px 0; }
.ver { font-size: 0.75rem; color: var(--muted); }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
h2 { margin: 0 0 10px; font-size: 1.1rem; color: var(--accent); }
.hidden { display: none !important; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar { margin-top: 4px; align-items: center; }
input[type="email"],
input[type="text"] {
  width: 100%;
  flex: 1;
  min-width: 180px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0d121a;
  color: var(--text);
  font-size: 1rem;
  margin-bottom: 10px;
}
.login-form label {
  display: block;
  color: var(--muted);
  font-size: 0.85rem;
  margin: 8px 0 4px;
}
.error {
  color: var(--danger);
  font-size: 0.9rem;
  margin-top: 10px;
}
button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 1rem;
  font-weight: 600;
  min-height: 44px;
}
button.primary { background: var(--accent); color: #1a1200; }
button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
button.huge { width: 100%; margin-top: 12px; padding: 18px; font-size: 1.25rem; min-height: 52px; }
button.ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  margin-top: 8px;
  margin-right: 6px;
}
button.skip {
  width: 100%;
  min-height: 48px;
  margin-top: 14px;
  background: #243047;
  color: var(--text);
  border: 1px solid var(--border);
  font-size: 1.05rem;
}
.hint { color: var(--muted); font-size: 0.85rem; }
.login-form { margin-top: 8px; }
.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 12px 0;
}
.stats .label { display: block; color: var(--muted); font-size: 0.8rem; }
.stats .num { font-size: 1.4rem; font-weight: 700; }
.stats .num.big { color: var(--ok); font-size: 1.8rem; }
.stats .unit { margin-left: 4px; color: var(--muted); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.card-tile {
  background: #121a26;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  font-size: 0.85rem;
}
.card-tile .name { font-weight: 700; font-size: 1rem; color: var(--accent); }
.card-tile .slot {
  display: inline-block;
  background: #243047;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.75rem;
  margin: 4px 0;
}
.rarity-badge {
  display: inline-block;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 4px 10px;
  border-radius: 999px;
  margin: 6px 0;
  letter-spacing: 0.04em;
}
.rarity-badge.普通 { background: rgba(154,168,188,0.2); color: var(--rarity-common); border: 1px solid var(--rarity-common); }
.rarity-badge.優秀 { background: rgba(61,139,253,0.18); color: var(--rarity-good); border: 1px solid var(--rarity-good); }
.rarity-badge.史詩 { background: rgba(179,136,255,0.18); color: var(--rarity-epic); border: 1px solid var(--rarity-epic); }
.rarity-badge.傳說 { background: rgba(232,168,56,0.2); color: var(--rarity-legend); border: 1px solid var(--rarity-legend); }

/* Flip stage */
.flip-stage {
  perspective: 1000px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding: 8px 0;
}
.flip-card {
  width: min(260px, 80vw);
  height: 340px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.75s ease-in-out;
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-card.instant { transition: none; }
.flip-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 16px;
  border: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  text-align: center;
}
.flip-back {
  background: linear-gradient(145deg, #1e2a3d 0%, #0d121a 100%);
  box-shadow: inset 0 0 40px rgba(232,168,56,0.15);
}
.flip-back .seal {
  font-size: 2.2rem;
  color: var(--accent);
  font-weight: 800;
  letter-spacing: 0.12em;
}
.flip-back .hint-tap { margin-top: 16px; color: var(--muted); font-size: 0.9rem; }
.flip-front {
  background: #121a26;
  transform: rotateY(180deg);
}
.flip-front .name { font-size: 1.45rem; color: var(--accent); margin: 8px 0 0; font-weight: 700; }
.result .name { font-size: 1.5rem; color: var(--accent); margin: 0; }
.result .dup { color: var(--danger); }
.result.revealed-front { margin-top: 8px; }
.log { list-style: none; padding: 0; margin: 0; }
.log li {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}
footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 20px; }
@media (min-width: 600px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .flip-card { transition-duration: 0.01ms !important; }
}

/* —— Collection tiles clickable —— */
.card-tile {
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s;
  min-height: 44px;
  text-align: left;
  width: 100%;
  color: inherit;
  font: inherit;
  display: block;
}
.card-tile:hover,
.card-tile:focus-visible {
  border-color: var(--accent);
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.card-tile:active { transform: scale(0.98); }
.card-tile .tile-thumb {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 8px;
  margin-bottom: 8px;
  background: #0d121a;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-tile .tile-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-tile .tile-thumb .ph {
  font-size: 0.7rem;
  color: var(--muted);
  text-align: center;
  padding: 6px;
  line-height: 1.3;
}

/* —— Fullscreen card modal —— */
.card-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 0;
}
.card-modal.hidden { display: none !important; }
.card-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(5, 8, 14, 0.88);
}
.card-modal-panel {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  max-height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card-modal-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.btn-modal-back {
  flex-shrink: 0;
  min-height: 52px !important;
  font-size: 1.2rem !important;
  margin-top: 0 !important;
  width: 100%;
}

/* Detail card shell */
.detail-card {
  width: 100%;
  background: #121a26;
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.detail-card.rarity-frame-普通 { border-color: var(--rarity-common); box-shadow: 0 0 0 1px rgba(154,168,188,0.35), 0 12px 40px rgba(0,0,0,0.45); }
.detail-card.rarity-frame-優秀 { border-color: var(--rarity-good); box-shadow: 0 0 0 1px rgba(61,139,253,0.4), 0 12px 40px rgba(0,0,0,0.45); }
.detail-card.rarity-frame-史詩 { border-color: var(--rarity-epic); box-shadow: 0 0 0 1px rgba(179,136,255,0.45), 0 12px 40px rgba(0,0,0,0.45); }
.detail-card.rarity-frame-傳說 { border-color: var(--rarity-legend); box-shadow: 0 0 0 1px rgba(232,168,56,0.5), 0 12px 40px rgba(0,0,0,0.45); }

/* 3:4 portrait reserved for character art */
.portrait {
  width: min(340px, 82vw);
  aspect-ratio: 3 / 4;
  margin: 0 auto 12px;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  background: linear-gradient(160deg, #1e2a3d 0%, #0d121a 100%);
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.portrait.slot-戰鋒 { background: linear-gradient(160deg, #3a1e28 0%, #0d121a 70%); }
.portrait.slot-護環 { background: linear-gradient(160deg, #1e3a2e 0%, #0d121a 70%); }
.portrait.slot-軸心 { background: linear-gradient(160deg, #1e2a4a 0%, #0d121a 70%); }
.portrait img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
.portrait img.loaded { display: block; }
.portrait .portrait-ph {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  color: var(--muted);
  font-size: 0.9rem;
}
.portrait.has-art .portrait-ph { display: none; }
.portrait .portrait-ph .slot-tag {
  font-size: 0.75rem;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(0,0,0,0.35);
  color: var(--text);
}

.detail-card .name {
  font-size: 1.55rem;
  font-weight: 800;
  color: var(--accent);
  margin: 4px 0 6px;
}
.detail-card .meta {
  color: var(--muted);
  font-size: 0.95rem;
  margin: 4px 0;
}
.detail-card .stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 10px 0;
  text-align: center;
  font-size: 0.8rem;
}
.detail-card .stats-row span {
  background: #0d121a;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 4px;
}
.detail-card .stats-row strong { display: block; color: var(--text); font-size: 0.95rem; }
.detail-card .lore {
  margin: 10px 0 4px;
  font-size: 0.95rem;
  line-height: 1.45;
  color: var(--text);
}
.detail-card .dup { color: var(--danger); font-weight: 700; margin-top: 8px; }
.detail-card .new-tag { color: var(--ok); font-weight: 700; margin-top: 8px; }
.detail-card .count-badge {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #243047;
  font-size: 0.85rem;
  color: var(--muted);
}

/* Flip inside modal */
.card-modal .flip-stage { width: 100%; }
.card-modal .flip-card {
  width: min(340px, 82vw);
  height: auto;
  aspect-ratio: 3 / 4.2;
  margin: 0 auto;
}
.card-modal .flip-front {
  justify-content: flex-start;
  overflow-y: auto;
  padding: 10px;
}
.card-modal .flip-front .portrait {
  width: 100%;
  margin-bottom: 8px;
}
</style>
